name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pyflakes mongomock coverage pip-audit
      - run: python -m playwright install --with-deps chromium   # for tests/test_forms.py
      - run: python -m pyflakes jobbot tests
      - run: python -m coverage run --source=jobbot -m unittest discover -s tests -v
      - run: python -m coverage report --show-missing
      - run: python -m pip_audit -r requirements.txt
