name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyflakes
      - run: python -m playwright install --with-deps chromium   # for tests/test_forms.py
      - run: python -m pyflakes jobbot tests
      - run: python -m unittest discover -s tests -v
